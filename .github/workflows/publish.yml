name: publish

# Publishes ghcr.io/clevim/yatagarasu:
#   - lean scratch image (:latest, :X.Y.Z, :X.Y) from Dockerfile
#   - all-in-one image (:allinone, :vX.Y.Z-allinone, :X.Y-allinone) from Dockerfile.allinone
# Tests gate both pushes: a scratch image with no shell is not something you debug
# on a NAS.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # api_test.lua is skipped without an interpreter, and a skip is not a pass.
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lua5.1
      - run: go vet ./... && go test ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest only from master; a tag also publishes 1.2.3 / 1.2.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lean
          cache-to: type=gha,mode=max,scope=lean

  publish-allinone:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # allinone only from master; a tag also publishes v1.2.3-allinone / 1.2-allinone.
          tags: |
            type=raw,value=allinone,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}-allinone
            type=semver,pattern={{major}}.{{minor}}-allinone

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allinone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=allinone
          cache-to: type=gha,mode=max,scope=allinone
